<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Special 💜</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  color:white;
  background:
    radial-gradient(circle at center,
      #5d267d 0%,
      #291442 42%,
      #090812 100%);
}

/* background glow */
body:before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(190,50,255,.18);
  filter:blur(80px);
  animation:glow 5s infinite alternate;
}

@keyframes glow{
  from{transform:scale(.8)}
  to{transform:scale(1.2)}
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-40px;
  color:#ff70c8;
  font-size:20px;
  animation:float 7s linear forwards;
  pointer-events:none;
  text-shadow:0 0 10px #ff4db9;
}

@keyframes float{
  0%{
    transform:translateY(0) rotate(0);
    opacity:0;
  }
  15%{opacity:1}
  100%{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}

/* main */
.container{
  position:relative;
  z-index:5;
  width:92%;
  max-width:650px;
  text-align:center;
}

/* progress */
.progress-area{
  margin-bottom:25px;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:bold;
  color:#ff80cf;
  margin-bottom:8px;
}

.progress{
  height:5px;
  background:rgba(255,255,255,.15);
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:20%;
  background:#ff65c5;
  box-shadow:0 0 12px #ff65c5;
  transition:.5s;
}

/* card */
.card{
  padding:42px 25px 38px;
  border-radius:23px;
  background:rgba(70,25,95,.35);
  border:1px solid rgba(255,100,210,.65);
  box-shadow:
    0 0 25px rgba(255,60,190,.2),
    inset 0 0 25px rgba(255,100,220,.04);
  backdrop-filter:blur(12px);
  animation:appear .6s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(15px) scale(.96);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.emoji{
  font-size:55px;
  display:block;
  margin-bottom:18px;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  50%{transform:translateY(-7px)}
}

.question{
  margin:0 auto 30px;
  max-width:570px;
  font-size:38px;
  line-height:1.3;
  font-weight:normal;
  text-shadow:
    0 0 8px #fff,
    0 0 20px rgba(255,100,210,.6);
}

button{
  border:0;
  padding:15px 30px;
  min-width:210px;
  border-radius:50px;
  color:white;
  background:linear-gradient(135deg,#ff69c8,#c84cff);
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,70,190,.65);
  transition:.25s;
}

button:hover{
  transform:scale(1.06);
}

button:active{
  transform:scale(.96);
}

/* finish */
.finish{
  display:none;
}

.finish .big{
  font-size:75px;
  animation:bounce 1.5s infinite;
}

.finish h1{
  font-size:48px;
  text-shadow:0 0 20px #ff65c5;
}

.finish p{
  font-size:25px;
  line-height:1.4;
}

/* mobile */
@media(max-width:600px){

  .card{
    padding:32px 18px;
  }

  .question{
    font-size:30px;
  }

  .emoji{
    font-size:45px;
  }

  .finish h1{
    font-size:40px;
  }

  .finish p{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div id="hearts"></div>

<div class="container">

  <div id="quiz">

    <div class="progress-area">

      <div class="progress-text">
        <span id="count">Question 1 of 5</span>
        <span id="percent">20%</span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="bar"></div>
      </div>

    </div>

    <div class="card" id="card">

      <span class="emoji" id="emoji">💗</span>

      <div class="question" id="question">
        Do you believe some people enter our lives for a special reason?
      </div>

      <button onclick="nextQuestion()" id="button">
        I believe 💌
      </button>

    </div>

  </div>


  <div class="finish" id="finish">

    <div class="big">💖</div>

    <h1>You made it! 💕</h1>

    <p>
      Thank you for staying till the end.<br>
      You are truly special to me. 🫶✨
    </p>

    <button onclick="restart()">
      Start Again 💗
    </button>

  </div>

</div>


<script>

const questions = [
  {
    emoji:"💗",
    text:"Do you believe some people enter our lives for a special reason?",
    button:"I believe 💌"
  },
  {
    emoji:"💕",
    text:"Will you stay forever with me, through every moment and every dream?",
    button:"Forever 💌"
  },
  {
    emoji:"🫶",
    text:"If life gets difficult, will you still be there for me?",
    button:"Always 🤍"
  },
  {
    emoji:"💖",
    text:"Will you keep our beautiful memories close to your heart?",
    button:"Of course 💕"
  },
  {
    emoji:"🥰",
    text:"Are you ready for unlimited love and beautiful memories?",
    button:"Always ready 💌"
  }
];

let current=0;

function showQuestion(){

  let q=questions[current];

  document.getElementById("emoji").innerText=q.emoji;
  document.getElementById("question").innerText=q.text;
  document.getElementById("button").innerText=q.button;

  let number=current+1;
  let percent=(number/questions.length)*100;

  document.getElementById("count").innerText=
    "Question "+number+" of "+questions.length;

  document.getElementById("percent").innerText=
    percent+"%";

  document.getElementById("bar").style.width=
    percent+"%";

  let card=document.getElementById("card");

  card.style.animation="none";
  void card.offsetWidth;
  card.style.animation="appear .6s ease";
}

function nextQuestion(){

  if(current < questions.length-1){

    current++;
    showQuestion();

  }else{

    document.getElementById("quiz").style.display="none";
    document.getElementById("finish").style.display="block";

    for(let i=0;i<25;i++){
      setTimeout(createHeart,i*100);
    }
  }
}

function restart(){

  current=0;

  document.getElementById("finish").style.display="none";
  document.getElementById("quiz").style.display="block";

  showQuestion();
}

function createHeart(){

  let heart=document.createElement("div");

  heart.className="heart";

  const types=["♥","♡","💗","💖","💕"];

  heart.innerText=
    types[Math.floor(Math.random()*types.length)];

  heart.style.left=
    Math.random()*100+"%";

  heart.style.fontSize=
    (12+Math.random()*18)+"px";

  heart.style.animationDuration=
    (5+Math.random()*5)+"s";

  document.getElementById("hearts").appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },10000);
}

setInterval(createHeart,700);

showQuestion();

</script>

</body>
</html>
