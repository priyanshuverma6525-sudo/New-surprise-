<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something Special For You 💜</title>

<!-- Handwritten fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 45%, #54217f 0%, #28154d 35%, #090c18 100%);
    color:white;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(190,67,255,.30),
        rgba(130,30,220,.12) 40%,
        transparent 70%
    );
    filter:blur(20px);
    animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.9);
        opacity:.65;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.1);
        opacity:1;
    }
}

/* ================= PARTICLES ================= */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    opacity:.7;
    box-shadow:0 0 8px #d77cff;
    animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

/* ================= HEARTS ================= */

.heart{
    position:absolute;
    bottom:-50px;
    color:#ff68b7;
    font-size:18px;
    opacity:.75;
    filter:drop-shadow(0 0 8px rgba(255,90,190,.7));
    animation:heartFloat linear forwards;
}

@keyframes heartFloat{

    0%{
        transform:translateY(0) rotate(0deg) scale(.7);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    50%{
        transform:translateY(-50vh) translateX(30px)
                   rotate(25deg) scale(1);
    }

    100%{
        transform:translateY(-115vh) translateX(-40px)
                   rotate(-20deg) scale(.8);
        opacity:0;
    }
}

/* ================= MAIN ================= */

.container{
    position:relative;
    z-index:10;
    width:min(92%,700px);
    text-align:center;
}

/* ================= INTRO ================= */

.intro{
    animation:introIn 1.2s ease forwards;
}

@keyframes introIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.intro-heart{
    font-size:75px;
    display:block;
    margin-bottom:15px;
    filter:drop-shadow(0 0 20px #ff66bd);
    animation:heartBeat 1.8s infinite;
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.12);
    }
}

.intro-text{
    font-family:"Great Vibes",cursive;
    font-size:42px;
    line-height:1.25;
    color:#fff;
    text-shadow:
        0 0 8px #ff9bdf,
        0 0 20px rgba(255,80,190,.7);
}

.intro-line{
    width:170px;
    height:3px;
    margin:15px auto 0;
    border-radius:10px;
    background:linear-gradient(90deg,transparent,#ff72c7,transparent);
    box-shadow:0 0 12px #ff72c7;
}

/* ================= QUIZ ================= */

.quiz{
    display:none;
}

.top{
    width:100%;
    margin-bottom:28px;
}

.top-info{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    padding:0 4px;

    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
    color:#ff72c7;
}

.progress{
    position:relative;
    width:100%;
    height:5px;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    box-shadow:0 0 8px rgba(255,100,210,.15);
}

.progress-fill{
    height:100%;
    width:0%;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #ff4eb5,
        #ff8bd8
    );
    box-shadow:
        0 0 8px #ff55bd,
        0 0 18px rgba(255,70,190,.7);
    transition:width .6s ease;
}

.progress-dots{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    justify-content:space-between;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#6d496f;
    border:1px solid rgba(255,255,255,.15);
}

.dot.active{
    background:#ff6bc7;
    box-shadow:0 0 9px #ff6bc7;
}

/* ================= CARD ================= */

.card{
    position:relative;
    padding:45px 35px 38px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(150,80,190,.18),
            rgba(70,30,110,.20)
        );

    border:1px solid rgba(255,105,205,.55);

    box-shadow:
        0 0 15px rgba(255,70,190,.20),
        inset 0 0 30px rgba(255,90,210,.05);

    backdrop-filter:blur(12px);

    animation:cardIn .7s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(15px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:22px;
    pointer-events:none;
    box-shadow:0 0 25px rgba(255,70,190,.15);
}

/* emoji */

.question-emoji{
    font-size:55px;
    margin-bottom:15px;
    display:block;

    animation:emojiFloat 2.5s ease-in-out infinite;
}

@keyframes emojiFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-7px);
    }
}

/* question */

.question{
    margin:0 auto 30px;

    max-width:560px;

    font-family:"Great Vibes",cursive;
    font-size:39px;
    line-height:1.35;

    color:#fff;

    text-shadow:
        0 0 7px rgba(255,255,255,.7),
        0 0 15px rgba(255,120,220,.55);
}

/* ================= BUTTON ================= */

.answer-btn{
    border:none;
    outline:none;

    min-width:210px;

    padding:15px 30px;

    border-radius:50px;

    color:white;

    font-family:Arial,sans-serif;
    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff6bc9,
            #d84eff
        );

    box-shadow:
        0 0 10px rgba(255,70,190,.65),
        0 5px 20px rgba(150,40,190,.35);

    transition:
        transform .25s,
        box-shadow .25s;
}

.answer-btn:hover{
    transform:translateY(-3px) scale(1.04);

    box-shadow:
        0 0 15px #ff67c8,
        0 8px 25px rgba(190,50,220,.45);
}

.answer-btn:active{
    transform:scale(.96);
}

/* ================= FINISH ================= */

.finish{
    display:none;
}

.finish-heart{
    font-size:75px;
    filter:drop-shadow(0 0 20px #ff65c4);
    animation:heartBeat 1.5s infinite;
}

.finish-title{
    margin-top:15px;

    font-family:"Great Vibes",cursive;
    font-size:50px;

    text-shadow:
        0 0 10px #ff9bdf,
        0 0 25px #ff55bd;
}

.finish-message{
    margin:20px auto;
    max-width:500px;

    font-family:"Caveat",cursive;
    font-size:28px;
    line-height:1.4;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .container{
        width:92%;
    }

    .intro-text{
        font-size:34px;
    }

    .intro-heart{
        font-size:60px;
    }

    .card{
        padding:32px 20px 28px;
        border-radius:20px;
    }

    .question-emoji{
        font-size:45px;
    }

    .question{
        font-size:31px;
        line-height:1.35;
        margin-bottom:25px;
    }

    .answer-btn{
        min-width:185px;
        padding:14px 24px;
    }

    .finish-title{
        font-size:42px;
    }

    .finish-message{
        font-size:24px;
    }
}

</style>
</head>


<body>

<!-- ================= BACKGROUND ================= -->

<div class="background">

    <div class="glow"></div>

</div>


<!-- ================= MAIN ================= -->

<div class="container">

    <!-- INTRO SCREEN -->

    <div class="intro" id="intro">

        <span class="intro-heart">💗</span>

        <div class="intro-text">
            Preparing something special for you...
        </div>

        <div class="intro-line"></div>

    </div>


    <!-- QUIZ -->

    <div class="quiz" id="quiz">

        <div class="top">

            <div class="top-info">

                <span id="questionNumber">
                    Question 1 of 5
                </span>

                <span id="percentage">
                    20%
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>


                <div class="progress-dots">

                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>

                </div>

            </div>

        </div>


        <div class="card" id="card">

            <span
                class="question-emoji"
                id="questionEmoji">
                💕
            </span>


            <h1
                class="question"
                id="question">
                Will you stay forever with me,
                through every moment and every dream?
            </h1>


            <button
                class="answer-btn"
                id="answerButton"
                onclick="nextQuestion()">

                Forever 💌 Always

            </button>

        </div>

    </div>


    <!-- FINISH -->

    <div class="finish" id="finish">

        <div class="finish-heart">
            💖
        </div>

        <div class="finish-title">
            You made it! 💕
        </div>

        <div class="finish-message">
            Thank you for staying till the end.
            You are truly special to me. 🫶✨
        </div>

        <button
            class="answer-btn"
            onclick="restart()">

            Start Again 💗

        </button>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
   ===================================================== */

const questions = [

    {
        text:
        "Do you believe some people enter our lives for a special reason? 💕",

        emoji:"💗",

        button:
        "I believe 💌"
    },

    {
        text:
        "Will you stay forever with me, through every moment and every dream? 🥰",

        emoji:"💞",

        button:
        "Forever 💌 Always"
    },

    {
        text:
        "If life gets difficult, will you still be there for me? 🫶",

        emoji:"🤝",

        button:
        "Always 🤍"
    },

    {
        text:
        "Will you keep all our beautiful memories close to your heart? 💖",

        emoji:"🥹",

        button:
        "Of course 💕"
    },

    {
        text:
        "Are you ready for unlimited love and cuddles? 🥰",

        emoji:"😘",

        button:
        "Always ready 💌"
    }

];


let currentQuestion = 0;


/* =====================================================
   ELEMENTS
   ===================================================== */

const intro =
    document.getElementById("intro");

const quiz =
    document.getElementById("quiz");

const finish =
    document.getElementById("finish");

const question =
    document.getElementById("question");

const questionEmoji =
    document.getElementById("questionEmoji");

const answerButton =
    document.getElementById("answerButton");

const questionNumber =
    document.getElementById("questionNumber");

const percentage =
    document.getElementById("percentage");

const progressFill =
    document.getElementById("progressFill");

const card =
    document.getElementById("card");

const dots =
    document.querySelectorAll(".dot");


/* =====================================================
   INTRO
   ===================================================== */

setTimeout(() => {

    intro.style.display = "none";

    quiz.style.display = "block";

    showQuestion();

},3000);


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showQuestion(){

    const item =
        questions[currentQuestion];

    question.style.opacity="0";

    questionEmoji.style.opacity="0";

    card.style.animation="none";

    void card.offsetWidth;

    card.style.animation="cardIn .7s ease";


    setTimeout(()=>{

        question.innerText =
            item.text;

        questionEmoji.innerText =
            item.emoji;

        answerButton.innerText =
            item.button;

        question.style.opacity="1";

        questionEmoji.style.opacity="1";

    },150);


    const number =
        currentQuestion + 1;

    const percent =
        Math.round(
            (number / questions.length) * 100
        );


    questionNumber.innerText =
        `Question ${number} of ${questions.length}`;

    percentage.innerText =
        `${percent}%`;


    progressFill.style.width =
        `${percent}%`;


    dots.forEach((dot,index)=>{

        if(index <= currentQuestion){

            dot.classList.add("active");

        }else{

            dot.classList.remove("active");

        }

    });

}


/* =====================================================
   NEXT QUESTION
   ===================================================== */

function nextQuestion(){

    if(currentQuestion <
       questions.length - 1){

        currentQuestion++;

        showQuestion();

    }else{

        quiz.style.display="none";

        finish.style.display="block";

        createManyHearts();

    }

}


/* =====================================================
   RESTART
   ===================================================== */

function restart(){

    currentQuestion=0;

    finish.style.display="none";

    quiz.style.display="block";

    showQuestion();

}


/* =====================================================
   FLOATING HEARTS
   ===================================================== */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className="heart";

    const heartTypes=[
        "♥",
        "♡",
        "💗",
        "💖",
        "💕"
    ];

    heart.innerText =
        heartTypes[
            Math.floor(
                Math.random()*heartTypes.length
            )
        ];


    heart.style.left =
        Math.random()*100 + "%";


    heart.style.fontSize =
        (10 + Math.random()*18) + "px";


    heart.style.animationDuration =
        (5 + Math.random()*7) + "s";


    document
        .querySelector(".background")
        .appendChild(heart);


    setTimeout(()=>{

        heart.remove();

    },13000);

}


setInterval(createHeart,650);


/* =====================================================
   EXTRA HEARTS
   ===================================================== */

function createManyHearts(){

    for(let i=0;i<30;i++){

        setTimeout(
            createHeart,
            i*120
        );

    }

}


/* =====================================================
   PARTICLES
   ===================================================== */

function createParticle(){

    const particle =
        document.createElement("div");

    particle.className="particle";


    particle.style.left =
        Math.random()*100 + "%";


    particle.style.top =
        Math.random()*100 + "%";


    particle.style.animationDelay =
        Math.random()*3 + "s";


    document
        .querySelector(".background")
        .appendChild(particle);

}


for(let i=0;i<45;i++){

    createParticle();

}

</script>

</body>
</html>
